name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sharlo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Used by apps/api's RLS test suite (docs/reports/SHARLO-M0-006.md) —
      # a real Postgres proving cross-tenant isolation, not a mock. Dev-only
      # throwaway credentials against an ephemeral CI-only database; never
      # used outside this workflow.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sharlo
      APP_DATABASE_URL: postgres://app_user:app_user_dev_password@localhost:5432/sharlo
      APP_DB_ROLE_PASSWORD: app_user_dev_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks (format, lint, typecheck, test)
        run: npm run ci

      - name: Build
        run: npm run build

  detection-harness:
    name: Detection engine test harness (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # M1-010 (docs/reports/SHARLO-M1-010.md): runs the real M1-003
      # through M1-009 detection pipeline against synthetic fixtures in a
      # real headless Chromium — OpenCV WASM, canvas rendering, and ArUco
      # decoding can't be faithfully exercised in jsdom (see each
      # module's own *.test.ts for why those stay mocked/hand-built-data
      # unit tests instead). This sandbox's own pre-installed Chromium
      # doesn't help a fresh runner here — every run needs its own
      # install.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Runs `pretest:e2e` first (npm lifecycle convention, same as this
      # package's existing predev/prebuild) to build the harness's
      # browser bundle before Playwright starts it.
      - name: Run detection engine test harness
        run: npm run test:e2e
        working-directory: apps/web

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates infra/ (M0-005) actually builds — this sandbox has no
      # reachable Docker daemon to check this locally (docs/reports/
      # SHARLO-M0-005.md), so this is the real verification, same pattern
      # as the RLS test in M0-006. Build only, no push/run: a full
      # `docker compose up` needs real domains for Caddy's TLS issuance,
      # which only exists once the founder's VPS/DNS are live.
      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t sharlo-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t sharlo-web:ci .

      - name: Validate docker-compose.yml
        run: |
          docker compose -f docker-compose.yml config --quiet
        env:
          POSTGRES_USER: ci_check
          POSTGRES_PASSWORD: ci_check
          APP_DB_ROLE_PASSWORD: ci_check
          APP_DOMAIN: ci-check.example.com
          API_DOMAIN: ci-check-api.example.com
