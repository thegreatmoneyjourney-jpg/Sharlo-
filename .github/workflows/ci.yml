name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sharlo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Used by apps/api's RLS test suite (docs/reports/SHARLO-M0-006.md) —
      # a real Postgres proving cross-tenant isolation, not a mock. Dev-only
      # throwaway credentials against an ephemeral CI-only database; never
      # used outside this workflow.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sharlo
      APP_DATABASE_URL: postgres://app_user:app_user_dev_password@localhost:5432/sharlo
      APP_DB_ROLE_PASSWORD: app_user_dev_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks (format, lint, typecheck, test)
        run: npm run ci

      - name: Build
        run: npm run build
